<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Market</title>
  <meta name="description" content="Find and install Claude Code plugins, skills and agents from the ai-market marketplace.">
  <meta name="color-scheme" content="dark light">
  <script>
    // Apply the saved theme before first paint to avoid a flash of the wrong theme.
    try { if (JSON.parse(localStorage.getItem('ai-market:theme')) === 'light') document.documentElement.dataset.theme = 'light'; } catch {}
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f0b45a'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='14' text-anchor='middle' fill='%231b1306'%3E%3E_%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true">&gt;_</span>ai-market <small>catalog</small></a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="browse">Browse</a>
        <a href="#/stack" data-nav="stack">My stack <span class="count" id="stack-count" hidden>0</span></a>
        <a href="#/whats-new" data-nav="whats-new">What's new</a>
        <a href="#/get-started" data-nav="get-started">Get started</a>
      </nav>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to light theme"></button>
    </div>
  </header>

  <main class="wrap" id="main">
    <section class="view" id="view-browse" aria-labelledby="browse-title">
      <form class="search-band" id="search-form" role="search">
        <h1 id="browse-title">Find a plugin, skill or agent</h1>
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Describe what you need, e.g. “I need a skill to review pull requests”" aria-label="Search the marketplace" aria-describedby="explain">
          <kbd aria-hidden="true">/</kbd>
        </div>
        <div class="examples" id="examples"></div>
        <div class="explain" id="explain" aria-live="polite"></div>
      </form>
      <div class="filters">
        <div class="tabs" role="tablist" aria-label="Artifact type" id="type-tabs"></div>
        <div class="selects">
          <select id="category" aria-label="Category"><option value="all">All categories</option></select>
          <select id="sort" aria-label="Sort">
            <option value="relevance">Best match</option>
            <option value="updated">Recently updated</option>
            <option value="name">Name A–Z</option>
          </select>
        </div>
      </div>
      <div class="result-count" id="result-count" aria-live="polite"></div>
      <div class="grid" id="results"></div>
    </section>

    <section class="view" id="view-item" hidden></section>

    <section class="view" id="view-placeholder" hidden>
      <div class="empty">
        <h2>Coming soon</h2>
        <p>This page is part of the next release of the catalog.</p>
        <a class="btn" href="#/">Back to search</a>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
