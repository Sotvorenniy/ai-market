# Marketplace harness: validates the catalog and every plugin with the Claude Code CLI.
# Kept apart from "Catalog site" so a broken plugin and a broken site show up as different checks.
name: Marketplace checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: 2.1.301 # pinned: the validator gains checks over time; bump on purpose

jobs:
  validate:
    name: Validate plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: English only
        run: |
          # Every file in the repository is in English (docs, code, comments, data).
          if git grep -nIP '[\x{0400}-\x{04FF}]' -- . ; then
            echo "::error::Non-English (Cyrillic) text found in the lines above."
            exit 1
          fi
      - name: Guard hook tests
        run: bash tests/sdd-guards.test.sh
      - name: No project-specific references in plugins
        run: |
          # Published plugins must stay project-independent (docs/specs/plugins.md §4).
          if [ -d plugins ] && { grep -rnIiE 'dev-?digest|\.devdigest|reviewer-core|server/clones|burnjohn' plugins || grep -rnIE '/Users/|/home/[a-z]' plugins; }; then
            echo "::error::Plugins contain project-specific references (see the lines above)."
            exit 1
          fi
      - name: Validate marketplace
        run: claude plugin validate . --strict
      - name: Validate each plugin
        run: |
          shopt -s nullglob
          status=0
          for dir in plugins/*/; do
            echo "::group::${dir}"
            claude plugin validate "${dir}" --strict || status=1
            echo "::endgroup::"
          done
          exit $status
